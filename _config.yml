title: Narrafield Studio
developer_team: sortie
description: 개발팀 sortie가 만드는 TRPG 엔진 Narrafield Studio. 세계관을 엮고, 선택지를 만들어 플레이할 수 있는 이야기로 완성하세요. 공식 제품 소개와 사용 가이드.
lang: ko
url: https://narrafield.com
baseurl: ""
repository: hawoond/narrafield-docs

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-sitemap

optional_front_matter:
  remove_originals: true

defaults:
  - scope:
      path: ""
    values:
      layout: guide
      lang: ko
  - scope:
      path: "en"
    values:
      layout: guide
      lang: en

# Repository maintenance files are not published as site pages.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
