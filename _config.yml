title: Narrafield Studio
description: 세계관을 엮고, 선택지를 만들고, 나만의 TRPG를 Windows 게임으로. 내러필드 스튜디오 공식 소개와 사용 가이드.
lang: ko
url: https://hawoond.github.io
baseurl: /narrafield-docs
repository: hawoond/narrafield-docs

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-sitemap

optional_front_matter:
  remove_originals: true

defaults:
  - scope:
      path: ""
    values:
      layout: guide

# Repository maintenance files are not published as site pages.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
