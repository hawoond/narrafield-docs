{% assign language = page.lang | default: 'ko' %}
{% assign ui = site.data.ui[language] %}
<footer class="site-footer wrap">
  <a class="wordmark" href="{{ ui.prefix | append: '/' | relative_url }}" aria-label="{{ ui.home_label }}">Narrafield<span>STUDIO</span></a>
  <p class="footer-line">{{ ui.footer_line }}</p>
  <div class="footer-meta">
    <nav aria-label="{{ ui.footer_nav }}"><a href="{{ ui.prefix | append: '/WIKI.html' | relative_url }}">{{ ui.guide }}</a><a href="https://github.com/{{ site.repository }}">{{ ui.repository }}</a></nav>
    <small>© Narrafield Studio</small>
  </div>
</footer>
