{% assign language = page.lang | default: 'ko' %}
{% assign ui = site.data.ui[language] %}
<header class="site-header wrap">
  <a class="wordmark" href="{{ ui.prefix | append: '/' | relative_url }}" aria-label="{{ ui.home_label }}">Narrafield<span>STUDIO</span></a>
  <nav class="header-nav" aria-label="{{ ui.site_nav }}">
    <a href="{{ ui.prefix | append: '/' | relative_url }}#experience">{{ ui.experience }}</a>
    <a href="{{ ui.prefix | append: '/WIKI.html' | relative_url }}">{{ ui.guide }}</a>
    <a href="{{ ui.prefix | append: '/' | relative_url }}#development">{{ ui.development }}</a>
  </nav>
  <a class="button button-outline header-cta" href="{{ ui.prefix | append: '/WIKI.html' | relative_url }}">{{ ui.open_wiki }} <span aria-hidden="true">↗</span></a>
  {% include language-nav.html %}
</header>
