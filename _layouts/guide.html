---
layout: base
---
<main id="main" class="wiki-layout wrap">
  <aside class="wiki-sidebar"><nav aria-label="위키 목차">{% include wiki-nav.html %}</nav></aside>
  <div class="wiki-main">
    <details class="wiki-mobile-nav"><summary>위키 목차</summary><nav aria-label="모바일 위키 목차">{% include wiki-nav.html %}</nav></details>
    <nav class="breadcrumbs" aria-label="현재 위치"><a href="{{ '/' | relative_url }}">소개</a><span aria-hidden="true">/</span><a href="{{ '/WIKI.html' | relative_url }}">사용자 위키</a>{% unless page.url == '/WIKI.html' %}<span aria-hidden="true">/</span><span>{{ page.title | escape }}</span>{% endunless %}</nav>
    <article class="wiki-article">{{ content }}</article>
    <p class="wiki-return"><a href="{{ '/WIKI.html' | relative_url }}">← 위키 전체 목차</a><a href="{{ '/' | relative_url }}">Narrafield 소개 →</a></p>
  </div>
</main>
