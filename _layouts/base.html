<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} · Narrafield Studio</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f6f4ef">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="{{ page.title | escape }} · Narrafield Studio">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/harbor.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% if page.layout == 'landing' %}<link rel="preload" as="image" href="{{ '/assets/images/harbor.png' | relative_url }}">{% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
  </body>
</html>
